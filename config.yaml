# Pipeline configuration.
# Nothing here is hardcoded in the source files -- everything tunable lives in this one place.

data:
  path: "data/compas_two_year_recidivism.csv"
  target: "two_year_recid"
  sensitive_attr: "race"          # excluded from model features, used only to audit fairness
  fairness_extra_columns: ["score_text"]   # COMPAS's own score, kept aside for the fairness comparison
  # id / COMPAS's own score (as before) + the 3 redundant columns found in week 3 (heatmap + VIF)
  drop_columns: ["id", "decile_score", "score_text", "prior_offenses", "age_in_months", "juvenile_total"]

split:
  test_size: 0.2
  random_state: 42

# Week 3 (01_eda_introduction.ipynb): used by src/data_diagnostics.py and clean_dataset()
diagnostics:
  id_column: "id"
  candidate_predictors: ["sex", "race", "age_cat", "c_charge_degree", "score_text"]  # for the missingness test
  validity_rules:                 # domain rules -- values outside these become NaN
    age: {min: 18, max: 100}
    decile_score: {min: 1, max: 10}
    juv_fel_count: {min: 0}
    priors_count: {min: 0, max: 60}
  placeholder_tokens: ["-", "?", "n/a", "N/A", "na", "NA", ""]   # missing values in disguise
  numeric_text_columns: ["priors_count", "prior_offenses"]      # load as text because of placeholders
  canonical_maps:                 # spelling variants -> one canonical label
    sex:
      male: "Male"
      female: "Female"
    race:
      african-american: "African-American"
      african american: "African-American"
      caucasian: "Caucasian"
      hispanic: "Hispanic"
      other: "Other"
      asian: "Asian"
      native american: "Native American"
    c_charge_degree:
      f: "F"
      felony: "F"
      m: "M"
      misdemeanor: "M"
    score_text:
      low: "Low"
      medium: "Medium"
      high: "High"
  redundant_columns: ["prior_offenses", "age_in_months", "juvenile_total"]   # multicollinearity

# Week 3 (02_preprocessing.ipynb): the leak-safe preprocessing recipe
preprocessing:
  encoder: "target"       # winner of the 4x4 encoder x scaler grid (15 repeated splits, mean acc 0.670)
  scaler: "standard"     # runner-up (target + none) is within noise -- paired check, 02_preprocessing.ipynb
  numeric_features: ["age", "juv_fel_count", "juv_misd_count", "juv_other_count", "priors_count"]
  categorical_features: ["sex", "age_cat", "c_charge_degree"]
  # MNAR columns: imputed AND given a `<col>_was_missing` flag
  mnar_indicator_sources: ["priors_count", "c_charge_degree"]
  # imputation matched to mechanism (the notebook's IMPUTATION_PLAN):
  #   numeric (age, juv_fel_count, priors_count, ...)  -> median
  #   categorical (sex, c_charge_degree, age_cat)      -> most_frequent
  imputation:
    numeric_strategy: "median"
    categorical_strategy: "most_frequent"

model:
  type: "decision_tree"   # or "decision_tree" or "logistic_regression"
  params: {}
  #  max_iter: 1000

output:
  results_dir: "results"   # each run's full report is saved here as a timestamped .txt file
